<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="container">
    <nav class="row bg-dark p-3">
        <div class="col text-white">
            <h5>🚗 Locadora de Veiculos</h5>
        </div>
            <div id="pc-menu" class="col text-end">
            <a href="dashboard.html" class="btn btn-outline-light">Dashboard</a>
            <a href="veiculos.html" class="btn btn-outline-light">Veiculos</a>
            <a href="clientes.html" class="btn btn-outline-light">Clientes</a>
            <a href="vendas.html" class="btn btn-outline-light">Vendas</a>
            <a href="#" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#logoutModal">Sair</a>
            </div>
        
            <div id="mobile-menu" class= "col text-end">
            <a href="#hamburger" data-bs-toggle="offcanvas" class="btn btn-outline-light">
            <img class="icon" src="https://files.catbox.moe/udvxgo.png" width="25" height="30">
            </a>
        </div>  
    </nav>

        <div id="hamburger" class="offcanvas offcanvas-start">
            <div class="offcanvas-title bg-dark text-white">
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            <h1 class="text-center">Menu</h1>
            </div>
            <div class="offcanvas-body bg-dark text-white">
                <a href="dashboard.html" class="text-start btn btn-dark d-grid"><span class="bi bi-graph-up">   Dashboard</span></a>
                <br>
                <a href="veiculos.html" class="text-start btn btn-dark d-grid"><span class="bi bi-car-front">  Veiculos</span></a>
                <br>
                <a href="clientes.html" class="text-start btn btn-primary d-grid"><span class="bi bi-person-lines-fill">  Clientes</span></a>
                <br>
                <a href="vendas.html" class="text-start btn btn-dark d-grid"><span class="bi bi-cart2">  Vendas</span></a>
                <br>
                <a href="#" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#logoutModal"><span class="bi bi-chevron-compact-left">  Sair</span></a>    
            </div>
        </div>

    <div class="modal fade" id="logoutModal" aria-labelledby="logoutModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-danger text-white">
                            <h5 class="modal-title" id="logoutModalLabel">Confirmar Saída</h5>
                            <button type="button" class="btn-close btn-close-white"data-bs-dismiss="modal" aria-label="Fechar"></button>
                        </div>
                        <div class="modal-body">
                            Tem certeza de que deseja sair da sua conta?
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary"data-bs-dismiss="modal">Não</button>
                            <a href="index.html" class="btn btn-danger" id="confirmLogout">Sim</a>
                        </div>
                    </div>
                </div>
            </div>
    
    <div class="d-flex justify-content-between align-items-center">
        <h2 class="mt-3">Clientes</h2>
        <div>
            <a href="#add-cliente" 
               data-bs-toggle="offcanvas" class="btn btn-dark">Novo Cliente</a>
        </div>
    </div>

    <div id="add-cliente" class="offcanvas offcanvas-start">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">
                Novo Cliente
            </h5>
        </div>
        <div class="offcanvas-body">
            <form action="">
                <label for="nome">Nome</label>
                <input type="text" id="nome" 
                       placeholder="Digite aqui" 
                       class="form-control mb-3">

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" 
                       placeholder="Digite aqui" 
                       class="form-control mb-3">

                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" 
                       placeholder="Digite aqui" 
                       class="form-control mb-3">

                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" 
                       placeholder="Digite aqui" 
                       class="form-control mb-3">
                
                <label for="foto">Foto</label>
                <input type="file" id="foto" 
                       class="form-control mb-3">

                    
                <button class="btn btn-dark w-100">
                    PRONTO
                </button>
            </form>
        </div>
    </div>

    <hr>
    <section class="card card-body">
    <div class="container">
        <div class="row mb-3">
            <div class="col-md-6">
                 <input id="searchInput" type="search" class="form-control" placeholder="Filtrar por nome, email ou cidade...">
            </div>

        <div class="col-md-6 text-end">
            <button id="btnrecarregar" class="btn btn-dark">Recarregar</button>
        </div>
        </div>
        <div class="table-responsive">
        <table id="tabelalocatarios" class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th class="sortable" data-key="id">ID</th>
                <th>Foto</th>
                <th class="sortable" data-key="nome">Nome</th>
                <th class="sortable" data-key="email">Email</th>
                <th class="sortable" data-key="telefone">Telefone</th>
                <th class="sortable" data-key="cidade">Cidade</th>
                <th class="sortable" data-key="dataCadastro">Data cadastro</th>
                <th>Ações</th> <!-- Coluna de ações sem ordenação -->
            </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
        </div>
        <div id="status" class="mt-2 text-muted"></div>
    </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>  

</body>
</html>
